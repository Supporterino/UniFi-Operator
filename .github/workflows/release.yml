name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish artifacts for, for example v0.2.3.
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Derive the release version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          if [ -z "${tag}" ]; then
            echo "no release tag supplied" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/supporterino/unifi-operator:${{ needs.version.outputs.version }}
            ghcr.io/supporterino/unifi-operator:${{ needs.version.outputs.minor }}

  cli:
    name: Publish CLI binaries
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: cli/go.sum
      - name: Cross-compile and attach the CLI archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Verify the chart carries the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chart_version="$(helm show chart charts/unifi-operator | awk '$1 == "version:" { print $2 }')"
          chart_app_version="$(helm show chart charts/unifi-operator | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')"
          if [ "${chart_version}" != "${VERSION}" ] || [ "${chart_app_version}" != "${VERSION}" ]; then
            echo "chart version ${chart_version} / appVersion ${chart_app_version} does not match release ${VERSION}" >&2
            exit 1
          fi
      - name: Log in to ghcr.io
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${HELM_REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${HELM_REGISTRY_USER}" --password-stdin
      - name: Package the chart
        run: helm package charts/unifi-operator --destination dist
      - name: Push the chart to the OCI registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm push "dist/unifi-operator-${VERSION}.tgz" oci://ghcr.io/supporterino/charts

  install-bundle:
    name: Publish install bundle
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: operator/go.sum
      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the consolidated install bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: task build-installer
      - name: Attach the install bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "${TAG}" dist/install.yaml --clobber
