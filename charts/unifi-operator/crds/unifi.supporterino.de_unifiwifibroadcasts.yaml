          status:
            description: status defines the observed state of UnifiWifiBroadcast
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the UnifiWifiBroadcast resource.

                  The primary readiness signal is the "Ready" condition.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              networkID:
                description: |-
                  networkID is the UUID of the upstream network the broadcast belongs to.
                  It is resolved transitively through spec.networkRef and recorded in
                  status only.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              origin:
                description: |-
                  origin is the upstream broadcast origin (USER_DEFINED, DERIVED, or
                  ORCHESTRATED). Only USER_DEFINED broadcasts are written; any other origin
                  is adopted read-only and reported here.
                type: string
              siteID:
                description: |-
                  siteID is the UUID of the upstream site the broadcast belongs to. It is
                  resolved transitively through the referenced network's siteRef and
                  recorded in status only so teardown does not depend on the live
                  reference chain.
                type: string
              summary:
                description: summary is a human-readable summary of the last reconciliation.
                type: string
              wifiBroadcastID:
                description: |-
                  wifiBroadcastID is the UUID of the upstream WiFi broadcast. It is
                  recorded in status only, never in spec.
                type: string
            type: object
        required:
        - spec
        type: object
