{{- if and .Values.rbac.create .Values.metrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "unifi-operator.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "unifi-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "unifi-operator.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "unifi-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
