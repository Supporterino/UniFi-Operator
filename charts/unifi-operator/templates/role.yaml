{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "unifi-operator.fullname" . }}-manager-role
  labels:
    {{- include "unifi-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - unifi.supporterino.de
  resources:
  - unificontrollers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - unifi.supporterino.de
  resources:
  - unifiaclruleorderings/status
  - unifiaclrules/status
  - unificontrollers/status
  - unifidnspolicies/status
  - unififirewallpolicies/status
  - unififirewallpolicyorderings/status
  - unififirewallzones/status
  - unifinetworks/status
  - unifiradiusprofiles/status
  - unifisites/status
  - unifisitetositetunnels/status
  - unifiswitchinglags/status
  - unifiswitchingmclagdomains/status
  - unifiswitchingswitchstacks/status
  - unifitrafficmatchinglists/status
  - unifivpnservers/status
  - unifiwifibroadcasts/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - unifi.supporterino.de
  resources:
  - unifiaclruleorderings
  - unifiaclrules
  - unifidnspolicies
  - unififirewallpolicies
  - unififirewallpolicyorderings
  - unififirewallzones
  - unifinetworks
  - unifiradiusprofiles
  - unifisitetositetunnels
  - unifiswitchinglags
  - unifiswitchingmclagdomains
  - unifiswitchingswitchstacks
  - unifitrafficmatchinglists
  - unifivpnservers
  - unifiwifibroadcasts
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - unifi.supporterino.de
  resources:
  - unifisites
  verbs:
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
