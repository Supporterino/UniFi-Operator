# Default values for unifi-operator.
#
# This chart renders the same core objects as the canonical kustomize deployment
# in operator/config/default: the manager Deployment, its ServiceAccount and
# RBAC, the metrics Service, and the UnifiController, UnifiSite, and UnifiNetwork
# CRDs. Keep the two paths in sync when either changes.
#
# The manager resolves UniFi API credentials at reconcile time from a
# same-namespace Secret referenced by each UnifiController's spec.secretRef.
# Never put credentials in this file or in a values override.
#
# The UnifiController, UnifiSite, and UnifiNetwork CRDs ship in the chart's crds/
# directory. Helm installs them on first `helm install` only; `helm upgrade` does
# not upgrade CRDs. Pass --skip-crds to skip installation. Note that `helm template`
# omits crds/ output unless it is run with --include-crds.

# -- Number of manager replicas. Leader election keeps a single active manager.
replicaCount: 1

image:
  # -- Manager image repository.
  repository: controller
  # -- Manager image tag. Falls back to the chart appVersion when empty.
  tag: latest
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for the manager Pod.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the prefix used to name the chart's resources.
fullnameOverride: ""

serviceAccount:
  # -- Create the manager ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to "<fullname>-controller-manager".
  name: ""
  # -- Annotations to add to the manager ServiceAccount.
  annotations: {}

rbac:
  # -- Create the manager ClusterRole/ClusterRoleBinding, the leader-election
  # Role/RoleBinding, the metrics RBAC, and the UnifiController, UnifiSite, and
  # UnifiNetwork admin/editor/viewer helper ClusterRoles.
  create: true

leaderElection:
  # -- Pass --leader-elect to the manager.
  enabled: true

metrics:
  # -- Expose the controller-runtime metrics endpoint. When enabled the manager
  # receives --metrics-bind-address, a metrics Service is created, and the
  # metrics reader/auth RBAC is installed.
  enabled: true
  # -- Port the metrics Service and manager endpoint listen on.
  port: 8443

# -- Annotations added to the manager Pod.
podAnnotations: {}
# -- Extra labels added to the manager Pod.
podLabels: {}

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for the manager container.
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the manager Pod.
nodeSelector: {}
# -- Tolerations for the manager Pod.
tolerations: []
# -- Affinity for the manager Pod.
affinity: {}

# -- Termination grace period for the manager Pod.
terminationGracePeriodSeconds: 10
