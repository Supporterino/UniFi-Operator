# Default values for unifi-operator.
#
# This chart renders the same core objects as the canonical kustomize deployment
# in operator/config/default: the manager Deployment, its ServiceAccount and
# RBAC, the metrics Service, and the UnifiController, UnifiSite, and UnifiNetwork
# CRDs. Keep the two paths in sync when either changes.
#
# The manager resolves UniFi API credentials at reconcile time from a
# same-namespace Secret referenced by each UnifiController's spec.secretRef.
# Never put credentials in this file or in a values override.
#
# The UnifiController, UnifiSite, and UnifiNetwork CRDs ship in the chart's crds/
# directory. Helm installs them on first `helm install` only; `helm upgrade` does
# not upgrade CRDs. Pass --skip-crds to skip installation. Note that `helm template`
# omits crds/ output unless it is run with --include-crds.

# -- Number of manager replicas. Leader election keeps a single active manager.
replicaCount: 1

image:
  # -- Manager image repository.
  repository: ghcr.io/supporterino/unifi-operator
  # -- Manager image tag. Intentionally empty in the committed tree so the rendered
  # tag follows the chart `appVersion` (see templates/deployment.yaml:
  # `image.tag | default .Chart.AppVersion`). release-please keeps `appVersion`
  # equal to the bundle version, so a released chart references the matching image
  # without a second source of truth. The image only exists once the release
  # workflow publishes it; override with `--set image.tag=<tag>` to pin another.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for the manager Pod.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the prefix used to name the chart's resources.
fullnameOverride: ""

serviceAccount:
  # -- Create the manager ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to "<fullname>-controller-manager".
  name: ""
  # -- Annotations to add to the manager ServiceAccount.
  annotations: {}

rbac:
  # -- Create the manager ClusterRole/ClusterRoleBinding, the leader-election
  # Role/RoleBinding, the metrics RBAC, and the UnifiController, UnifiSite, and
  # UnifiNetwork admin/editor/viewer helper ClusterRoles.
  create: true

leaderElection:
  # -- Pass --leader-elect to the manager.
  enabled: true

metrics:
  # -- Expose the controller-runtime metrics endpoint. When enabled the manager
  # receives --metrics-bind-address, a metrics Service is created, and the
  # metrics reader/auth RBAC is installed.
  enabled: true
  # -- Port the metrics Service and manager endpoint listen on.
  port: 8443
  # -- Name of a Secret holding the metrics server certificate under the keys
  # "ca.crt", "tls.crt", and "tls.key". When set together with
  # metrics.enabled, the manager mounts it read-only at
  # /tmp/k8s-metrics-server/metrics-certs and receives --metrics-cert-path for
  # that directory, so it serves this certificate instead of the
  # controller-runtime self-signed default. Mirrors the [METRICS-WITH-CERTS]
  # patch in operator/config/default/kustomization.yaml field for field.
  #
  # Empty disables the mount. The mount itself is not optional: once this is
  # set, a missing Secret leaves the manager Pod in ContainerCreating with a
  # FailedMount warning event and the Deployment never becomes available, so
  # create the Secret first.
  certSecretName: ""

  # Prometheus Operator scrape configuration, opt-in and disabled by default:
  # the monitoring.coreos.com CRDs are not installed by this chart, so a default
  # `helm install` must not require them. When enabled, the rendered
  # ServiceMonitor matches the canonical kustomize scrape path
  # (operator/config/prometheus): path /metrics, port name "https", scheme
  # https, and the scraping Pod's projected service-account token as the bearer
  # token. docs/deployment.md documents the metrics-reader ClusterRoleBinding
  # the Prometheus service account needs; this chart does not create it.
  serviceMonitor:
    # -- Render a monitoring.coreos.com/v1 ServiceMonitor selecting this
    # release's metrics Service. Requires the Prometheus Operator CRDs to exist
    # already. Ignored when metrics.enabled is false: there would be no metrics
    # Service to select.
    enabled: false
    # -- Scrape interval for the metrics endpoint, for example "30s". Empty by
    # default, so the key is omitted and the Prometheus server's configured
    # scrape interval applies — the same as the kustomize scrape path, which
    # sets no interval either.
    interval: ""
    # -- Extra labels on the ServiceMonitor object, for example to match a
    # Prometheus serviceMonitorSelector such as `release: kube-prometheus-stack`.
    labels: {}
    # -- TLS settings rendered verbatim as spec.endpoints[0].tlsConfig, used
    # only when insecureSkipVerify is false. Certificate verification is on, so
    # the CA referenced here must be one the scraping Prometheus can trust.
    #
    # The manager serves a controller-runtime self-signed certificate unless it
    # runs with --metrics-cert-path, which metrics.certSecretName supplies. The
    # Secret referenced here therefore does not exist unless you create it:
    # create "metrics-server-cert" from a certificate you issued (the
    # repository ships no Certificate) holding ca.crt, tls.crt, and tls.key,
    # then set metrics.certSecretName so the manager serves it. While it is
    # missing — or while the manager still serves its self-signed default —
    # Prometheus reports a failed scrape instead of trusting the endpoint.
    tlsConfig:
      ca:
        secret:
          name: metrics-server-cert
          key: ca.crt
    # -- INSECURE: scrape the metrics endpoint without verifying its
    # certificate. Anything able to answer on the metrics Service address can
    # then impersonate the endpoint and feed fabricated metrics, and neither the
    # operator nor Prometheus can tell. Use it only when the manager serves its
    # controller-runtime self-signed certificate and you cannot supply a CA, and
    # never in production. When true it replaces tlsConfig with
    # `insecureSkipVerify: true`, mirroring the kustomize overlay
    # operator/config/prometheus-insecure.
    insecureSkipVerify: false

# -- Annotations added to the manager Pod.
podAnnotations: {}
# -- Extra labels added to the manager Pod.
podLabels: {}

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for the manager container.
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the manager Pod.
nodeSelector: {}
# -- Tolerations for the manager Pod.
tolerations: []
# -- Affinity for the manager Pod.
affinity: {}

# -- Termination grace period for the manager Pod.
terminationGracePeriodSeconds: 10
