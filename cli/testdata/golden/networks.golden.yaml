---
apiVersion: unifi.supporterino.de/v1alpha1
kind: UnifiNetwork
metadata:
  name: default
spec:
  dhcpGuarding:
    trustedDhcpServerIpAddresses:
    - 192.168.1.254
  enabled: true
  management: UNMANAGED
  name: Default
  siteRef:
    name: default
  vlanId: 1
---
apiVersion: unifi.supporterino.de/v1alpha1
kind: UnifiNetwork
metadata:
  name: guest-wifi
spec:
  enabled: false
  gateway:
    cellularBackupEnabled: false
    internetAccessEnabled: true
    ipv4Configuration:
      autoScaleEnabled: true
      hostIpAddress: 192.168.20.1
      prefixLength: 24
    ipv6Configuration:
      clientAddressAssignment:
        slaacEnabled: true
      hostIpAddress: fd00:20::1
      interfaceType: STATIC
      prefixLength: 64
    isolationEnabled: true
    mdnsForwardingEnabled: true
  management: GATEWAY
  name: Guest WiFi
  siteRef:
    name: default
  vlanId: 20
---
apiVersion: unifi.supporterino.de/v1alpha1
kind: UnifiNetwork
metadata:
  name: iot
spec:
  enabled: true
  management: SWITCH
  name: IoT
  siteRef:
    name: default
  switch:
    cellularBackupEnabled: true
    deviceTag:
      name: iot-switch
    ipv4Configuration:
      autoScaleEnabled: false
      hostIpAddress: 192.168.30.1
      prefixLength: 24
    isolationEnabled: true
  vlanId: 30
