                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$
                type: string
              vlan:
                description: VLAN is the 802.1Q VLAN tag. Omit for an untagged network.
                format: int32
                maximum: 4094
                minimum: 1
                type: integer
