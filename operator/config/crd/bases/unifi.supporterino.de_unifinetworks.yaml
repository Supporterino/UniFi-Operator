---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: unifinetworks.unifi.supporterino.de
spec:
  group: unifi.supporterino.de
  names:
    kind: UnifiNetwork
    listKind: UnifiNetworkList
    plural: unifinetworks
    singular: unifinetwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.management
      name: Management
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnifiNetwork is the Schema for the unifinetworks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of UnifiNetwork
            properties:
              dhcpGuarding:
                description: |-
                  DHCPGuarding configures trusted DHCP server addresses for this network.
                  Omit to disable the feature.
                properties:
                  trustedDhcpServerIpAddresses:
                    description: |-
                      TrustedDHCPServerIPAddresses is the list of trusted DHCP server IP
                      addresses. At least one entry is required when DHCP guarding is enabled.
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - trustedDhcpServerIpAddresses
                type: object
              enabled:
                default: true
                description: Enabled controls whether the network is enabled.
                type: boolean
              gateway:
                description: |-
                  Gateway configures a network with management GATEWAY. It is required for
                  management GATEWAY and forbidden otherwise (CEL).
                properties:
                  cellularBackupEnabled:
                    description: |-
                      CellularBackupEnabled allows this network to use cellular data when WAN
                      connections are down.
                    type: boolean
                  internetAccessEnabled:
                    description: InternetAccessEnabled allows internet access for
                      devices on this network.
                    type: boolean
                  ipv4Configuration:
                    description: IPv4Configuration is the IPv4 configuration for this
                      network.
                    properties:
                      additionalHostIpSubnets:
                        description: AdditionalHostIPSubnets are additional host IP
                          subnets for this VLAN.
                        items:
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                      autoScaleEnabled:
                        description: AutoScaleEnabled allows the subnet to scale based
                          on active DHCP leases.
                        type: boolean
                      hostIpAddress:
                        description: HostIPAddress is the IPv4 address assigned to
                          the network.
                        type: string
                      prefixLength:
                        description: PrefixLength is the IPv4 subnet prefix length
                          (8..30).
                        format: int32
                        maximum: 30
                        minimum: 8
                        type: integer
                    required:
                    - autoScaleEnabled
                    - hostIpAddress
                    - prefixLength
                    type: object
                  ipv6Configuration:
                    description: |-
                      IPv6Configuration is the IPv6 configuration for this network. Omit to
                      leave IPv6 unconfigured.
                    properties:
                      additionalHostIpSubnets:
                        description: AdditionalHostIPSubnets are additional host IP
                          subnets for this VLAN.
                        items:
                          type: string
                        maxItems: 4
                        minItems: 1
                        type: array
                      clientAddressAssignment:
                        description: ClientAddressAssignment configures how client
                          addresses are assigned.
                        properties:
                          slaacEnabled:
                            description: |-
                              SLAACEnabled allows devices to obtain addresses via stateless address
                              autoconfiguration.
                            type: boolean
                        required:
                        - slaacEnabled
                        type: object
                      dnsServerIpAddressesOverride:
                        description: |-
                          DNSServerIPAddressesOverride are the IPv6 DNS servers assigned to this
                          network. Omit to select them automatically.
                        items:
                          type: string
                        maxItems: 4
                        minItems: 1
                        type: array
                      hostIpAddress:
                        description: |-
                          HostIPAddress is the static IPv6 address assigned to this network.
                          Required for interfaceType STATIC.
                        type: string
                      interfaceType:
                        description: InterfaceType selects the IPv6 addressing variant.
                        enum:
                        - PREFIX_DELEGATION
                        - STATIC
                        type: string
                      prefixDelegationWan:
                        description: |-
                          PrefixDelegationWAN selects the upstream WAN interface the prefix is
                          delegated from by name. Required for interfaceType PREFIX_DELEGATION.
                        properties:
                          name:
                            description: Name is the human-readable WAN interface
                              name.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      prefixLength:
                        description: |-
                          PrefixLength is the static IPv6 subnet prefix length (64..127). Required
                          for interfaceType STATIC.
                        format: int32
                        maximum: 127
                        minimum: 64
                        type: integer
                      routerAdvertisement:
                        description: RouterAdvertisement configures IPv6 router advertisement.
                        properties:
                          priority:
                            description: Priority is the router advertisement priority.
                            enum:
                            - LOW
                            - MEDIUM
                            - HIGH
                            type: string
                        required:
                        - priority
                        type: object
                    required:
                    - clientAddressAssignment
                    - interfaceType
                    type: object
                    x-kubernetes-validations:
                    - message: static fields require interfaceType STATIC
                      rule: 'self.interfaceType == ''STATIC'' ? (has(self.hostIpAddress)
                        && has(self.prefixLength)) : (!has(self.hostIpAddress) &&
                        !has(self.prefixLength))'
                    - message: prefixDelegationWan requires interfaceType PREFIX_DELEGATION
                      rule: 'self.interfaceType == ''PREFIX_DELEGATION'' ? has(self.prefixDelegationWan)
                        : !has(self.prefixDelegationWan)'
                  isolationEnabled:
                    description: IsolationEnabled isolates this network from all other
                      networks.
                    type: boolean
                  mdnsForwardingEnabled:
                    description: |-
                      MDNSForwardingEnabled controls whether this network participates in mDNS
                      traffic forwarding. Omit to use the site mDNS default.
                    type: boolean
                required:
                - cellularBackupEnabled
                - internetAccessEnabled
                - ipv4Configuration
                - isolationEnabled
                type: object
              management:
                description: Management is the union discriminator (GATEWAY, SWITCH,
                  or UNMANAGED).
                enum:
                - GATEWAY
                - SWITCH
                - UNMANAGED
                type: string
              name:
                description: Name is the human-readable network name.
                minLength: 1
                type: string
              siteRef:
                description: |-
                  SiteRef references the UnifiSite that owns this network. The reference
                  resolves in the same namespace.
                properties:
                  name:
                    description: |-
                      Name is the name of the referenced object in the referencing object's
                      namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              switch:
                description: |-
                  Switch configures a network with management SWITCH. It is required for
                  management SWITCH and forbidden otherwise (CEL).
                properties:
                  cellularBackupEnabled:
                    description: |-
                      CellularBackupEnabled allows this network to use cellular data when WAN
                      connections are down.
                    type: boolean
                  deviceTag:
                    description: |-
                      DeviceTag selects the existing device tag whose member device manages
                      this network. Tags are read-only upstream (there is no device-tag Custom
                      Resource), so the selector names the tag and keeps the opaque upstream
                      device UUID out of spec. The reconciler resolves the tag through the
                      read-only device-tags list and requires exactly one member device.
                    properties:
                      name:
                        description: Name is the human-readable device-tag name.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  ipv4Configuration:
                    description: IPv4Configuration is the IPv4 configuration for this
                      network.
                    properties:
                      additionalHostIpSubnets:
                        description: AdditionalHostIPSubnets are additional host IP
                          subnets for this VLAN.
                        items:
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                      autoScaleEnabled:
                        description: AutoScaleEnabled allows the subnet to scale based
                          on active DHCP leases.
                        type: boolean
                      hostIpAddress:
                        description: HostIPAddress is the IPv4 address assigned to
                          the network.
                        type: string
                      prefixLength:
                        description: PrefixLength is the IPv4 subnet prefix length
                          (8..30).
                        format: int32
                        maximum: 30
                        minimum: 8
                        type: integer
                    required:
                    - autoScaleEnabled
                    - hostIpAddress
                    - prefixLength
                    type: object
                  isolationEnabled:
                    description: IsolationEnabled isolates this network from all other
                      networks.
                    type: boolean
                required:
                - cellularBackupEnabled
                - deviceTag
                - ipv4Configuration
                - isolationEnabled
                type: object
              vlanId:
                description: VLANID is the 802.1Q VLAN tag (1..4009; 1 is the default
                  network).
                format: int32
                maximum: 4009
                minimum: 1
                type: integer
            required:
            - management
            - name
            - siteRef
            - vlanId
            type: object
            x-kubernetes-validations:
            - message: gateway fields require management GATEWAY
              rule: 'self.management == ''GATEWAY'' ? has(self.gateway) : !has(self.gateway)'
            - message: switch fields require management SWITCH
              rule: 'self.management == ''SWITCH'' ? has(self.switch) : !has(self.switch)'
          status:
            description: status defines the observed state of UnifiNetwork
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the UnifiNetwork resource.

                  The primary readiness signal is the "Ready" condition.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              networkID:
                description: |-
                  networkID is the UUID of the upstream UniFi network. It is recorded in
                  status only, never in spec.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation the controller last
                  reconciled.
                format: int64
                type: integer
              summary:
                description: summary is a human-readable summary of the last reconciliation.
                type: string
              zoneID:
                description: |-
                  zoneID is the UUID of the firewall zone the network belongs to. Zone
                  membership is owned by UnifiFirewallZone; this resource only reports the
                  resolved zone in status.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
