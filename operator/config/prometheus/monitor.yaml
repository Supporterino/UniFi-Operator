# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # Certificate verification is on: nothing in this file disables it, so
        # Prometheus validates the metrics endpoint against the CA below.
        #
        # The CA must exist for the scrape to work. Nothing in this tree issues
        # it: create this Secret yourself, or write a cert-manager Certificate
        # whose secretName is "metrics-server-cert" and which carries "ca.crt".
        # The manager serves that certificate only when it runs with
        # --metrics-cert-path, which the [METRICS-WITH-CERTS] patch in
        # config/default/kustomization.yaml adds alongside a non-optional mount
        # of this Secret -- enabling the mount before the Secret exists keeps
        # the manager Pod from starting. That patch cannot set tlsConfig here,
        # because config/default does not include this ServiceMonitor: set
        # spec.endpoints[0].tlsConfig.serverName by hand to
        # <service>.<namespace>.svc.
        #
        # Without --metrics-cert-path the manager serves a controller-runtime
        # self-signed certificate valid only for "localhost", which no scraper
        # can trust; this ServiceMonitor will then fail to scrape. That case is
        # covered by the separately named overlay
        # operator/config/prometheus-insecure, which disables verification and
        # is documented as insecure.
        ca:
          secret:
            name: metrics-server-cert
            key: ca.crt
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: operator
