# [PROMETHEUS-WITH-CERTS] Patch for the ServiceMonitor to verify the metrics
# endpoint against the certificate cert-manager issued for the metrics Service.
# Certificate verification stays enabled.
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
    serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
    cert:
      secret:
        name: metrics-server-cert
        key: tls.crt
    keySecret:
      name: metrics-server-cert
      key: tls.key
