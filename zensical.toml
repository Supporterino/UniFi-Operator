[project]
site_url = "https://supporterino.github.io/UniFi-Operator/"
site_name = "UniFi-Operator"
site_description = "A Kubernetes operator that manages a UniFi network stack declaratively through Custom Resources."
# site_author = "Supporterino"

copyright = "Copyright &copy; 2026 Supporterino"

repo_url = "https://github.com/Supporterino/UniFi-Operator"
repo_name = "Supporterino/UniFi-Operator"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "CRD conventions" = "crd-conventions.md" },
  { "UniFi API contract" = "unifi-api.md" },
  { "Go bar" = "go.md" },
  { "Security" = "security.md" },
  { "Testing" = "testing.md" },
  { "Debugging" = "debugging.md" },
  { "Deployment" = "deployment.md" },
  { "Documentation" = "documentation.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
